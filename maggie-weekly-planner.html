<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>週計畫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5EFE6;
  --cream-dark: #EDE3D5;
  --warm1: #C4A882;
  --warm2: #A8896B;
  --warm3: #8B6F55;
  --warm-deep: #5C4033;
  --accent: #B07D5A;
  --green: #7A9B7A;
  --blue: #8FA8B8;
  --rose: #C4918A;
  --text: #3A2E28;
  --text-light: #8A7A70;
  --shadow: rgba(92,64,51,0.12);
  --c0: #C4A882;
  --c1: #8FA8B8;
  --c2: #9BAD8E;
  --c3: #C4918A;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--cream); font-family:'Noto Sans TC',sans-serif; color:var(--text); min-height:100vh; padding-bottom:60px; }

/* ONBOARDING */
#onboard { position:fixed; inset:0; background:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; padding:40px; }
#onboard.hidden { display:none; }
.onboard-title { font-family:'Playfair Display',serif; font-style:italic; font-size:32px; color:var(--warm-deep); margin-bottom:8px; }
.onboard-sub { color:var(--text-light); font-size:13px; margin-bottom:40px; letter-spacing:1px; }
.onboard-input { width:100%; max-width:280px; padding:14px 20px; border:1.5px solid var(--warm1); border-radius:12px; background:white; font-family:'Noto Sans TC',sans-serif; font-size:16px; color:var(--text); outline:none; text-align:center; }
.onboard-input:focus { border-color:var(--warm-deep); }
.onboard-btn { margin-top:16px; width:100%; max-width:280px; padding:14px; background:var(--warm-deep); color:white; border:none; border-radius:12px; font-family:'Noto Sans TC',sans-serif; font-size:15px; font-weight:500; cursor:pointer; letter-spacing:1px; }
.onboard-leaf { font-size:48px; margin-bottom:16px; }

/* APP */
#app { display:none; }
#app.show { display:block; }

/* HEADER */
.header { background:var(--warm-deep); padding:20px 20px 0; position:sticky; top:0; z-index:100; }
.header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.header-title { font-family:'Playfair Display',serif; font-style:italic; color:var(--cream); font-size:20px; }
.header-settings { background:none; border:none; color:rgba(245,239,230,0.6); font-size:18px; cursor:pointer; padding:4px; }
.week-nav { display:flex; align-items:center; gap:12px; padding:12px 0; }
.week-btn { background:rgba(245,239,230,0.15); border:none; color:var(--cream); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.week-label { flex:1; text-align:center; color:rgba(245,239,230,0.85); font-size:13px; letter-spacing:0.5px; }

/* STATS BAR */
.stats-bar { display:flex; gap:0; border-top:1px solid rgba(245,239,230,0.12); }
.stat { flex:1; text-align:center; padding:10px 4px; }
.stat-num { color:var(--cream); font-size:18px; font-weight:500; }
.stat-label { color:rgba(245,239,230,0.5); font-size:10px; letter-spacing:0.5px; margin-top:1px; }

/* NAV TABS */
.nav-tabs { display:flex; background:var(--cream-dark); border-bottom:1px solid rgba(196,168,130,0.3); }
.nav-tab { flex:1; padding:12px 4px; text-align:center; font-size:12px; color:var(--text-light); border:none; background:none; cursor:pointer; letter-spacing:0.5px; border-bottom:2px solid transparent; transition:all 0.2s; }
.nav-tab.active { color:var(--warm-deep); border-bottom-color:var(--warm-deep); font-weight:500; }

/* PAGES */
.page { display:none; padding:16px; }
.page.active { display:block; }

/* DAY CARD */
.day-card { background:white; border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 2px 8px var(--shadow); }
.day-head { display:flex; align-items:center; padding:13px 16px; cursor:pointer; gap:10px; }
.day-dot { width:8px; height:8px; border-radius:50%; background:var(--cream-dark); flex-shrink:0; }
.day-dot.today { background:var(--accent); }
.day-name { font-size:14px; font-weight:500; flex:1; }
.day-name.today { color:var(--accent); }
.day-count { font-size:11px; color:var(--text-light); }
.day-toggle { color:var(--text-light); font-size:12px; transition:transform 0.2s; }
.day-toggle.open { transform:rotate(180deg); }
.day-body { display:none; padding:0 16px 12px; border-top:1px solid var(--cream-dark); }
.day-body.open { display:block; }
.empty-msg { color:var(--text-light); font-size:12px; padding:12px 0 4px; }

/* TASK */
.task-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--cream-dark); }
.task-item:last-of-type { border-bottom:none; }
.task-check { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--warm1); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.task-check.checked { background:var(--warm2); border-color:var(--warm2); }
.task-check.checked::after { content:'✓'; color:white; font-size:11px; }
.task-content { flex:1; min-width:0; }
.task-text { font-size:13.5px; line-height:1.4; transition:all 0.2s; }
.task-text.done-text { text-decoration:line-through; color:var(--text-light); }
.task-tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; margin-top:3px; color:white; opacity:0.85; }
.task-delete { background:none; border:none; color:var(--text-light); font-size:18px; cursor:pointer; padding:2px 4px; flex-shrink:0; line-height:1; }
.add-task-btn { width:100%; margin-top:10px; padding:9px; border:1.5px dashed var(--cream-dark); border-radius:10px; background:none; color:var(--text-light); font-size:13px; cursor:pointer; font-family:'Noto Sans TC',sans-serif; }
.add-task-btn:active { background:var(--cream-dark); }

/* HISTORY */
.history-card { background:white; border-radius:14px; margin-bottom:10px; padding:16px; box-shadow:0 2px 8px var(--shadow); }
.history-week { font-size:12px; color:var(--text-light); margin-bottom:6px; }
.history-rate { font-size:22px; font-weight:500; color:var(--warm-deep); }
.history-bar-bg { background:var(--cream-dark); border-radius:20px; height:6px; margin-top:8px; overflow:hidden; }
.history-bar-fill { height:100%; border-radius:20px; background:var(--accent); transition:width 0.4s; }
.history-detail { font-size:11px; color:var(--text-light); margin-top:4px; }

/* SETTINGS */
.settings-section { margin-bottom:20px; }
.settings-label { font-size:11px; color:var(--text-light); letter-spacing:1px; margin-bottom:10px; text-transform:uppercase; }
.settings-card { background:white; border-radius:14px; padding:16px; box-shadow:0 2px 8px var(--shadow); }
.cat-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--cream-dark); }
.cat-row:last-child { border-bottom:none; }
.cat-color-dot { width:24px; height:24px; border-radius:50%; flex-shrink:0; cursor:pointer; border:2px solid white; box-shadow:0 0 0 1.5px rgba(0,0,0,0.15); }
.cat-name-input { flex:1; border:none; outline:none; font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--text); background:none; }
.name-row { display:flex; align-items:center; gap:10px; padding:10px 0; }
.name-label { font-size:14px; color:var(--text-light); }
.name-val-input { flex:1; border:none; outline:none; font-family:'Noto Sans TC',sans-serif; font-size:14px; color:var(--text); background:none; text-align:right; }
.settings-save { width:100%; margin-top:8px; padding:14px; background:var(--warm-deep); color:white; border:none; border-radius:12px; font-family:'Noto Sans TC',sans-serif; font-size:14px; cursor:pointer; letter-spacing:1px; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:500; display:none; align-items:flex-end; }
.modal-overlay.open { display:flex; }
.modal { background:white; width:100%; border-radius:20px 20px 0 0; padding:24px 20px 40px; }
.modal-title { font-size:14px; font-weight:500; margin-bottom:16px; color:var(--warm-deep); }
.modal-input { width:100%; padding:12px 16px; border:1.5px solid var(--cream-dark); border-radius:10px; font-family:'Noto Sans TC',sans-serif; font-size:15px; color:var(--text); outline:none; margin-bottom:12px; }
.modal-input:focus { border-color:var(--warm1); }
.tag-select { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.tag-opt { padding:7px 14px; border-radius:20px; border:1.5px solid var(--cream-dark); font-size:12px; cursor:pointer; color:var(--text-light); transition:all 0.15s; }
.tag-opt.selected { border-color:transparent; color:white; }
.modal-add-btn { width:100%; padding:14px; background:var(--warm-deep); color:white; border:none; border-radius:12px; font-family:'Noto Sans TC',sans-serif; font-size:15px; cursor:pointer; }

/* COLOR PICKER */
.color-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:600; display:none; align-items:flex-end; }
.color-overlay.open { display:flex; }
.color-picker { background:white; width:100%; border-radius:20px 20px 0 0; padding:24px 20px 40px; }
.color-title { font-size:14px; font-weight:500; color:var(--warm-deep); margin-bottom:16px; }
.color-grid { display:flex; flex-wrap:wrap; gap:12px; }
.color-swatch { width:40px; height:40px; border-radius:50%; cursor:pointer; border:3px solid white; box-shadow:0 0 0 1.5px rgba(0,0,0,0.15); transition:transform 0.15s; }
.color-swatch.selected { box-shadow:0 0 0 3px var(--warm-deep); }
.color-swatch:active { transform:scale(0.9); }
</style>
</head>
<body>

<!-- ONBOARD -->
<div id="onboard">
  <div class="onboard-leaf">🌿</div>
  <div class="onboard-title">週計畫</div>
  <div class="onboard-sub">輸入你的名字開始使用</div>
  <input class="onboard-input" id="nameInput" type="text" placeholder="你的名字" maxlength="10">
  <button class="onboard-btn" onclick="startApp()">開始 →</button>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-title" id="appTitle">的週計畫</div>
      <button class="header-settings" onclick="switchTab('settings')">⚙</button>
    </div>
    <div class="week-nav">
      <button class="week-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-label" id="weekLabel"></div>
      <button class="week-btn" onclick="changeWeek(1)">›</button>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">任務</div></div>
      <div class="stat"><div class="stat-num" id="statDone">0</div><div class="stat-label">完成</div></div>
      <div class="stat"><div class="stat-num" id="statRate">0%</div><div class="stat-label">完成率</div></div>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('week')" id="tab-week">📅 本週</button>
    <button class="nav-tab" onclick="switchTab('history')" id="tab-history">📊 歷史</button>
    <button class="nav-tab" onclick="switchTab('settings')" id="tab-settings">⚙ 設定</button>
  </div>

  <!-- WEEK PAGE -->
  <div class="page active" id="page-week">
    <div id="weekContainer"></div>
  </div>

  <!-- HISTORY PAGE -->
  <div class="page" id="page-history">
    <div id="historyContainer"></div>
  </div>

  <!-- SETTINGS PAGE -->
  <div class="page" id="page-settings">
    <div class="settings-section">
      <div class="settings-label">我的名字</div>
      <div class="settings-card">
        <div class="name-row">
          <div class="name-label">顯示名稱</div>
          <input class="name-val-input" id="settingName" type="text" maxlength="10">
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">分類設定</div>
      <div class="settings-card" id="catSettings"></div>
    </div>
    <button class="settings-save" onclick="saveSettings()">儲存設定</button>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">新增任務</div>
    <input class="modal-input" id="taskInput" type="text" placeholder="任務內容..." maxlength="50">
    <div class="tag-select" id="tagSelect"></div>
    <button class="modal-add-btn" onclick="addTask()">新增</button>
  </div>
</div>

<!-- COLOR OVERLAY -->
<div class="color-overlay" id="colorOverlay">
  <div class="color-picker">
    <div class="color-title">選擇顏色</div>
    <div class="color-grid" id="colorGrid"></div>
  </div>
</div>

<script>
const COLORS = ['#C4A882','#8FA8B8','#9BAD8E','#C4918A','#A89BC4','#C4B98A','#8ABAB8','#B88A8A','#8AA8A0','#C4A4C4'];
const DAYS = ['日','一','二','三','四','五','六'];
const DAYS_FULL = ['週日','週一','週二','週三','週四','週五','週六'];

let userName = '';
let cats = [
  {name:'私人', emoji:'🏠', color:'#C4A882'},
  {name:'家庭', emoji:'👨‍👩‍👧', color:'#8FA8B8'},
  {name:'工作', emoji:'💼', color:'#9BAD8E'},
  {name:'其他', emoji:'✨', color:'#C4918A'}
];
let tasks = {}; // key: YYYY-MM-DD, val: [{id, text, tag, done}]
let currentWeekOffset = 0;
let modalDay = null;
let selectedTag = 0;
let colorPickerCat = null;

function save() {
  localStorage.setItem('wp_user', userName);
  localStorage.setItem('wp_cats', JSON.stringify(cats));
  localStorage.setItem('wp_tasks', JSON.stringify(tasks));
}

function load() {
  userName = localStorage.getItem('wp_user') || '';
  const c = localStorage.getItem('wp_cats');
  if (c) cats = JSON.parse(c);
  const t = localStorage.getItem('wp_tasks');
  if (t) tasks = JSON.parse(t);
}

function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function dateKey(d) {
  return d.toISOString().slice(0,10);
}

function isToday(d) {
  return dateKey(d) === dateKey(new Date());
}

function fmtWeek(dates) {
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(dates[0])} – ${f(dates[6])}`;
}

function startApp() {
  const n = document.getElementById('nameInput').value.trim();
  if (!n) return;
  userName = n;
  save();
  initApp();
}

function initApp() {
  document.getElementById('onboard').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('appTitle').textContent = userName + ' 的週計畫';
  render();
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'history') renderHistory();
  if (tab === 'settings') renderSettings();
}

function changeWeek(dir) {
  currentWeekOffset += dir;
  render();
}

function render() {
  const dates = getWeekDates(currentWeekOffset);
  document.getElementById('weekLabel').textContent = fmtWeek(dates);

  let total = 0, done = 0;
  dates.forEach(d => {
    const k = dateKey(d);
    const ts = tasks[k] || [];
    total += ts.length;
    done += ts.filter(t => t.done).length;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statRate').textContent = total ? Math.round(done/total*100) + '%' : '–';

  const container = document.getElementById('weekContainer');
  container.innerHTML = '';
  dates.forEach(d => {
    const k = dateKey(d);
    const ts = tasks[k] || [];
    const todayClass = isToday(d) ? ' today' : '';
    const card = document.createElement('div');
    card.className = 'day-card';
    const doneCnt = ts.filter(t => t.done).length;
    card.innerHTML = `
      <div class="day-head" onclick="toggleDay('${k}')">
        <div class="day-dot${isToday(d) ? ' today' : ''}"></div>
        <div class="day-name${todayClass}">週${DAYS[d.getDay()]}・${d.getMonth()+1}/${d.getDate()}</div>
        <div class="day-count">${ts.length > 0 ? doneCnt + '/' + ts.length : ''}</div>
        <span class="day-toggle${isToday(d) ? ' open' : ''}" id="toggle_${k}">▾</span>
      </div>
      <div class="day-body${isToday(d) ? ' open' : ''}" id="body_${k}">
        ${ts.length === 0 ? '<div class="empty-msg">還沒有任務 🌿</div>' : ''}
        ${ts.map(t => `
          <div class="task-item">
            <div class="task-check${t.done ? ' checked' : ''}" onclick="toggleTask('${k}',${t.id})"></div>
            <div class="task-content">
              <div class="task-text${t.done ? ' done-text' : ''}">${t.text}</div>
              <span class="task-tag" style="background:${cats[t.tag]?.color || '#aaa'}">${cats[t.tag]?.emoji || ''} ${cats[t.tag]?.name || ''}</span>
            </div>
            <button class="task-delete" onclick="deleteTask('${k}',${t.id})">×</button>
          </div>
        `).join('')}
        <button class="add-task-btn" onclick="openModal('${k}','週${DAYS[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}')">＋ 新增任務</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleDay(k) {
  const body = document.getElementById('body_' + k);
  const toggle = document.getElementById('toggle_' + k);
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

function openModal(k, title) {
  modalDay = k;
  selectedTag = 0;
  document.getElementById('modalTitle').textContent = '新增任務・' + title;
  document.getElementById('taskInput').value = '';
  renderTagSelect();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('taskInput').focus(), 100);
}

function renderTagSelect() {
  document.getElementById('tagSelect').innerHTML = cats.map((c,i) => `
    <div class="tag-opt${i === selectedTag ? ' selected' : ''}" style="${i === selectedTag ? 'background:' + c.color + ';border-color:' + c.color : ''}" onclick="selectTag(${i})">${c.emoji} ${c.name}</div>
  `).join('');
}

function selectTag(i) {
  selectedTag = i;
  renderTagSelect();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalDay = null;
}

function addTask() {
  const text = document.getElementById('taskInput').value.trim();
  if (!text || !modalDay) return;
  if (!tasks[modalDay]) tasks[modalDay] = [];
  const id = Date.now();
  tasks[modalDay].push({ id, text, tag: selectedTag, done: false });
  save();
  closeModal();
  render();
}

function toggleTask(k, id) {
  const t = (tasks[k] || []).find(x => x.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function deleteTask(k, id) {
  if (!tasks[k]) return;
  tasks[k] = tasks[k].filter(x => x.id !== id);
  save();
  render();
}

function renderHistory() {
  const container = document.getElementById('historyContainer');
  container.innerHTML = '';
  // collect all weeks that have tasks
  const allKeys = Object.keys(tasks).sort().reverse();
  if (allKeys.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:40px;font-size:13px;">還沒有任何記錄 🌿</div>';
    return;
  }
  // group by week
  const weekMap = {};
  allKeys.forEach(k => {
    const d = new Date(k);
    const day = d.getDay();
    const monday = new Date(d);
    monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    const wk = dateKey(monday);
    if (!weekMap[wk]) weekMap[wk] = [];
    weekMap[wk].push(k);
  });
  Object.keys(weekMap).sort().reverse().forEach(wk => {
    const keys = weekMap[wk];
    let total = 0, done = 0;
    keys.forEach(k => {
      (tasks[k] || []).forEach(t => { total++; if (t.done) done++; });
    });
    const rate = total ? Math.round(done/total*100) : 0;
    const wkEnd = new Date(wk);
    wkEnd.setDate(wkEnd.getDate() + 6);
    const label = `${new Date(wk).getMonth()+1}/${new Date(wk).getDate()} – ${wkEnd.getMonth()+1}/${wkEnd.getDate()}`;
    const card = document.createElement('div');
    card.className = 'history-card';
    card.innerHTML = `
      <div class="history-week">${label}</div>
      <div class="history-rate">${rate}%</div>
      <div class="history-bar-bg"><div class="history-bar-fill" style="width:${rate}%"></div></div>
      <div class="history-detail">${done} / ${total} 個任務完成</div>
    `;
    container.appendChild(card);
  });
}

function renderSettings() {
  document.getElementById('settingName').value = userName;
  const catDiv = document.getElementById('catSettings');
  catDiv.innerHTML = cats.map((c,i) => `
    <div class="cat-row">
      <div class="cat-color-dot" style="background:${c.color}" onclick="openColorPicker(${i})"></div>
      <input class="cat-name-input" id="catName_${i}" value="${c.name}" maxlength="8">
    </div>
  `).join('');
}

function saveSettings() {
  const n = document.getElementById('settingName').value.trim();
  if (n) { userName = n; document.getElementById('appTitle').textContent = userName + ' 的週計畫'; }
  cats.forEach((c,i) => {
    const inp = document.getElementById('catName_' + i);
    if (inp) c.name = inp.value.trim() || c.name;
  });
  save();
  switchTab('week');
  render();
}

function openColorPicker(i) {
  colorPickerCat = i;
  document.getElementById('colorGrid').innerHTML = COLORS.map(c => `
    <div class="color-swatch${cats[i].color === c ? ' selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>
  `).join('');
  document.getElementById('colorOverlay').classList.add('open');
}

function selectColor(c) {
  if (colorPickerCat === null) return;
  cats[colorPickerCat].color = c;
  document.getElementById('colorOverlay').classList.remove('open');
  renderSettings();
}

document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('colorOverlay').addEventListener('click', function(e) { if (e.target === this) document.getElementById('colorOverlay').classList.remove('open'); });
document.getElementById('taskInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') addTask(); });
document.getElementById('nameInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') startApp(); });

load();
if (userName) {
  document.getElementById('onboard').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('appTitle').textContent = userName + ' 的週計畫';
  render();
}
</script>
</body>
</html>
